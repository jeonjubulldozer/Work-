<style>
/* layout: one reading column, a sticky row of five tabs, cards that fall to one column on a phone */
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#141A21; --muted:#5A6572; --line:#D9DFE6; --soft:#EAEEF2;
  --accent:#1E5248; --accent-ink:#FFFFFF; --up:#C5302B; --down:#1F55C2; --warn:#9A5B06; --warn-bg:#FBF1DD;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#7CC9B8; --accent-ink:#0F1318; --up:#FF8076; --down:#84ADFF; --warn:#E3AA52; --warn-bg:#2E2513;
  --up-bg:#3A1F1D; --down-bg:#1A2740; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1318; --panel:#171D24; --ink:#E7ECF1; --muted:#98A5B3; --line:#2A333D; --soft:#1F2730;
  --accent:#7CC9B8; --accent-ink:#0F1318; --up:#FF8076; --down:#84ADFF; --warn:#E3AA52; --warn-bg:#2E2513;
  --up-bg:#3A1F1D; --down-bg:#1A2740; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:600;margin:0 0 4px}
h3{font-size:16px;font-weight:600;margin:0}
h4{font-size:14.5px;font-weight:600;margin:0 0 2px}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.head .sub{color:var(--muted);font-size:14px}
.legend{font-size:13px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.soon{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.soon h2{font-size:15px;margin-bottom:8px}
.soon ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.soon li{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline}
.soon .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.soon .w{min-width:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.tab{font:inherit;font-weight:500;padding:11px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.chip:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.card .rows{display:grid;gap:1px;font-size:13.5px;margin-top:2px}
.card .foot{font-size:12.5px;color:var(--muted);margin-top:6px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.co{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:76px}

.tk{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

.sub-h{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}

.nw li:first-child{border-top:0;padding-top:0}

.nw .hl{font-weight:600}
.nw p{max-width:72ch}
.tone{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tone.good{color:var(--up);background:var(--up-bg);border-color:transparent}
.tone.bad{color:var(--down);background:var(--down-bg);border-color:transparent}
.tag{font-size:12px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.mv{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.mv p{max-width:72ch;font-size:14px}
.hold{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:color-mix(in srgb, var(--accent) 16%, var(--panel));color:var(--accent);margin-left:6px;white-space:nowrap}
.tag.est{background:var(--warn-bg);color:var(--warn)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tile{border-radius:8px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}

.tile .p{font-family:var(--mono);font-size:16px;font-weight:500}
.tile .w{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
td .nm{font-weight:500} td .sm{font-size:12.5px;color:var(--muted)}
td.val{max-width:280px;min-width:200px;white-space:normal;text-align:left;font-size:13px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details>summary{cursor:pointer;padding:14px 18px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;list-style:none}

.call ul{margin:0;padding-left:18px;display:grid;gap:6px}
.pt{display:flex;flex-direction:column;gap:2px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:12px 14px;font-size:13.5px}
.note b{color:var(--warn)}
.gaps>summary{font-size:13.5px;color:var(--muted);padding:10px 16px}
.gaps ul{margin:0;padding:0 18px 12px 38px;font-size:13px;color:var(--muted);display:grid;gap:4px}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:76px}
.brief .big{font-weight:600;font-size:15.5px;max-width:72ch}
.brief ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.brief li{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:baseline;font-size:14px}
.brief li span:last-child{max-width:68ch}
.lb{font-size:12px;font-weight:600;padding:1px 0;border-radius:999px;text-align:center;white-space:nowrap}
.lb.good{color:var(--up);background:var(--up-bg)}
.lb.bad{color:var(--down);background:var(--down-bg)}
.lb.watch{color:var(--warn);background:var(--warn-bg)}
.lb.worry{color:var(--ink);background:var(--soft)}
.lb.int{color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--panel))}
.qa{display:grid;gap:10px}
.qa .q{font-weight:600;font-size:14px}
.qa .a{font-size:14px}
.brief details{border:0;background:transparent}
.brief details>summary{padding:4px 0;font-size:13.5px;color:var(--accent)}
.brief .call{padding:6px 0 0 0}
/* 요약 카드의 라벨 줄(64px 칸) 규칙이 '자세히 보기' 안 목록까지 번지지 않게 되돌린다 */
.brief .call ul{list-style:disc;padding-left:18px;display:grid;gap:6px}
.brief .call li{display:list-item;font-size:14px;max-width:72ch}
.plain{padding:14px 18px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.err{padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
@media (max-width:560px){
  .wrap{padding-inline:16px} h1{font-size:23px} .tabs{grid-template-columns:repeat(2,1fr)} .call{padding-left:20px}
  .soon li,.ev li{grid-template-columns:1fr;gap:0}
}
/* 듣기 탭: 위에 재생 설정과 이어 듣기 버튼, 아래에 기업별 콜 원고와 한 달 동향 카드, 재생 중에는 화면 아래 고정 재생 막대 */
.tabs{grid-template-columns:repeat(5,1fr)}
.btn{font:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1.3}
.btn svg{width:14px;height:14px;flex:none;fill:currentColor}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.mp button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.lis-top{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.lis-top .row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.lis-top .lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;min-width:44px}
.lis-top p{max-width:72ch}
select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.lis-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:110px;min-width:0}
.lis-card .meta{font-size:13px;color:var(--muted)}
.lis-card .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lis-card details{border:0;background:transparent}
.lis-card details>summary{padding:4px 0;font-size:13.5px;color:var(--accent)}
.script{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.script section{display:flex;flex-direction:column;gap:8px}
.script h4{font-size:13px;color:var(--muted);letter-spacing:.04em;margin:0}
.script p,.lis-card .tp{max-width:72ch;font-size:14.5px;line-height:1.75;padding:2px 6px;margin:0 -6px;border-radius:6px;transition:background-color .2s}
.now{background:color-mix(in srgb, var(--accent) 16%, var(--panel))}
.lis-card .wk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lis-card .wk li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;font-size:14px;padding:2px 6px;margin:0 -6px;border-radius:6px}
.lis-card .wk .d{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.lis-card .src{font-size:12.5px;color:var(--muted)}
.tag.nofull{background:var(--warn-bg);color:var(--warn)}
.pend{font-size:13px;color:var(--muted)}
.wrap.has-mp{padding-bottom:170px}
.mp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px color-mix(in srgb, var(--ink) 10%, transparent);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mp .in{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.mp .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mp button{font:inherit;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:42px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.mp button svg{width:15px;height:15px;fill:currentColor}
.mp button.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:54px}
.mp .rate{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mp .sp{flex:1}
@media (max-width:560px){
  .tabs{grid-template-columns:repeat(3,1fr)} .tab{padding:10px 4px;font-size:14px}
  .lis-card .wk li{grid-template-columns:1fr;gap:0}

@media (prefers-reduced-motion: reduce){ .script p,.lis-card .tp{transition:none} }
</style>

<div class="wrap">
  <header class="head">
    <h1>기업 현황판</h1>
    <div class="sub" id="sub">불러오는 중입니다.</div>
    <div class="legend"><span class="up">빨강 ▲ 오름</span> · <span class="down">파랑 ▼ 내림</span> · 수량과 평가금액은 싣지 않습니다</div>
  </header>

  <section class="soon" id="soon" hidden>
    <h2>앞으로 2주 안에 잡힌 일정</h2>
    <ul id="soon-list"></ul>
  </section>

  <nav class="tabs" role="tablist" aria-label="현황판 구역">
    <button class="tab" role="tab" id="t-market" data-tab="market" aria-selected="true">시장 현황</button>
    <button class="tab" role="tab" id="t-news" data-tab="news" aria-selected="false">기업 뉴스·일정</button>
    <button class="tab" role="tab" id="t-price" data-tab="price" aria-selected="false">가격</button>
    <button class="tab" role="tab" id="t-calls" data-tab="calls" aria-selected="false">실적 콜</button>
    <button class="tab" role="tab" id="t-listen" data-tab="listen" aria-selected="false">듣기</button>
  </nav>

  <main>
    <div class="panel" id="p-market" role="tabpanel" aria-labelledby="t-market"></div>
    <div class="panel" id="p-news" role="tabpanel" aria-labelledby="t-news" hidden></div>
    <div class="panel" id="p-price" role="tabpanel" aria-labelledby="t-price" hidden></div>
    <div class="panel" id="p-calls" role="tabpanel" aria-labelledby="t-calls" hidden></div>
    <div class="panel" id="p-listen" role="tabpanel" aria-labelledby="t-listen" hidden></div>
  </main>
</div>

<script>
(function(){
  var TABS=["market","news","price","calls","listen"], D=null, period="pct_1d", region="전체", query="";
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined&&text!==null) e.textContent=text; return e; }
  function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]) p.appendChild(arguments[i]); } return p; }
  function link(text, url){ if(!url) return el("span","muted",text); var a=el("a",null,text); a.href=url; a.target="_blank"; a.rel="noopener"; return a; }
  function fmt(n, dec){ if(n===null||n===undefined) return "—"; return Number(n).toLocaleString("ko-KR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  function auto(n){ if(n===null||n===undefined) return "—"; var a=Math.abs(n); return fmt(n, a>=1000?(Number.isInteger(n)?0:2):2); }
  function cls(p){ return p===null||p===undefined?"flat":(p>0?"up":(p<0?"down":"flat")); }
  function pct(p){ if(p===null||p===undefined) return "확인 못 함"; return (p>0?"▲ +":(p<0?"▼ ":"")+"")+fmt(p,2)+"%"; }
  function md(s){ if(!s) return "날짜 미정"; var d=new Date(s+"T00:00:00"); if(isNaN(d)) return s; return (d.getMonth()+1)+"/"+d.getDate()+" ("+"일월화수목금토".charAt(d.getDay())+")"; }
  function cur(c){ return {SEK:"크로나",GBP:"파운드",EUR:"유로",USD:"달러",KRW:"원"}[c]||c; }
  function pctSpan(label, p, basis){ var s=el("span",cls(p), label+" "+pct(p)+(basis==="stated"?" *":"")); return s; }

  function renderHead(){
    document.getElementById("sub").textContent = D.as_of+" 기준 · "+D.price_basis_ko;
    var from=new Date(D.as_of+"T00:00:00"), to=new Date(from.getTime()+14*864e5), rows=[];
    D.holdings.forEach(function(h){ (h.events||[]).forEach(function(e){ if(!e.date) return; var d=new Date(e.date+"T00:00:00"); if(d>=from&&d<=to) rows.push({d:e.date,h:h,e:e}); }); });
    rows.sort(function(a,b){ return a.d<b.d?-1:(a.d>b.d?1:0); });
    var ul=document.getElementById("soon-list"); ul.textContent="";
    rows.forEach(function(r){ var li=el("li"); add(li, el("span","d",md(r.d)));
      var w=el("span","w"); add(w, el("b",null,r.h.name_ko+" "), document.createTextNode((r.e.short_ko||r.e.what_ko)+" "), el("span","tag"+(r.e.confirmed?"":" est"), r.e.confirmed?"확정":"예상")); add(li,w); ul.appendChild(li); });
    document.getElementById("soon").hidden = rows.length===0;
  }

  function renderMarket(){
    var P=document.getElementById("p-market"), M=D.market; P.textContent="";
    var s1=el("section","sec"); add(s1, el("h2",null,"코스피 · 미국 3대 지수"));
