<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#1E5248"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../icon-192.png"></head><body>
<script src="../vault.js" data-home="../"></script>
<title>업무 현황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one reading column; a sticky row of four tabs; the first tab is only what needs the owner's answer, then dated events */
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#141A21; --muted:#5A6572; --line:#D9DFE6; --soft:#EAEEF2;
  --accent:#1E5248; --accent-ink:#FFFFFF; --warn:#9A5B06; --warn-bg:#FBF1DD; --warn-line:#E9CF95;
  --ok:#1E6B45; --ok-bg:#E3F2E9; --info:#1F55C2; --info-bg:#E6EEFB; --stop:#6B7480; --stop-bg:#E7EBEF;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1318; --panel:#171D24; --ink:#E7ECF1; --muted:#98A5B3; --line:#2A333D; --soft:#1F2730;
  --accent:#7CC9B8; --accent-ink:#0F1318; --warn:#E3AA52; --warn-bg:#2A2212; --warn-line:#5C4A22;
  --ok:#7FD0A2; --ok-bg:#16301F; --info:#84ADFF; --info-bg:#1A2740; --stop:#98A5B3; --stop-bg:#232B34; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1318; --panel:#171D24; --ink:#E7ECF1; --muted:#98A5B3; --line:#2A333D; --soft:#1F2730;
  --accent:#7CC9B8; --accent-ink:#0F1318; --warn:#E3AA52; --warn-bg:#2A2212; --warn-line:#5C4A22;
  --ok:#7FD0A2; --ok-bg:#16301F; --info:#84ADFF; --info-bg:#1A2740; --stop:#98A5B3; --stop-bg:#232B34; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:920px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.head p{max-width:68ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.tab{font:inherit;font-weight:500;padding:11px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .n{font-family:var(--mono);font-size:12.5px;opacity:.8;margin-left:4px}
.tab:focus-visible,.chipbtn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec>.note{font-size:13.5px;color:var(--muted);max-width:68ch}

.wait{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.wait h2{color:var(--warn)}
.wait ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:n}
.wait li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 50px;position:relative;counter-increment:n;display:flex;flex-direction:column;gap:3px;min-width:0}
.wait li::before{content:counter(n);position:absolute;left:14px;top:12px;font-family:var(--mono);font-weight:500;color:var(--warn);width:24px;text-align:right}
.wait .t{font-weight:600}
.wait .how{color:var(--muted);font-size:14px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.rows{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rows li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 16px;border-top:1px solid var(--soft);align-items:baseline;min-width:0}
.rows li:first-child{border-top:0}
.rows .k{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows.r li{grid-template-columns:1fr;gap:0}
.rows .s{font-size:13.5px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipbtn .n{font-family:var(--mono);font-size:12px;opacity:.75;margin-left:4px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.item .t{font-weight:600}
.item.done .t{color:var(--muted);font-weight:500}
.item .d{font-size:14px;color:var(--muted);max-width:72ch}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.done,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.doing,.chip.todo{background:var(--info-bg);color:var(--info)}
.chip.wait,.chip.need,.chip.check,.chip.part{background:var(--warn-bg);color:var(--warn)}
.chip.stop,.chip.no{background:var(--stop-bg);color:var(--stop)}
.empty{font-size:14px;color:var(--muted);padding:6px 2px}

.lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:16.5px;font-weight:500;max-width:none}
.plain{margin:0;padding-left:20px;display:grid;gap:8px;max-width:72ch}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.role{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.role .who{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.role .who b{font-size:16px}
.role .who span{font-size:13px;color:var(--muted)}
.role ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.files a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-decoration:none;font-size:14px}
.files a:hover{border-color:var(--accent)}

.conn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.conn li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.conn .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.conn .t{font-weight:600}
.conn .d{font-size:14px;color:var(--muted);max-width:72ch}
.conn .d b{color:var(--ink);font-weight:500}
.err{padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
@media (max-width:560px){
  .wrap{padding-inline:16px} h1{font-size:23px}
  .tabs{gap:6px} .tab{font-size:14px;padding:10px 2px} .tab .n{display:none}
  .wait{padding:14px 12px} .wait li{padding-left:40px} .wait li::before{left:6px}
  .rows li{grid-template-columns:76px 1fr;padding-inline:12px}
}
@media (prefers-reduced-motion:no-preference){ .tab,.chipbtn{transition:background-color .12s,color .12s} }
</style>

<div class="wrap">
  <header class="head">
    <h1>업무 현황판</h1>
    <div class="muted" id="asof">불러오는 중입니다.</div>
    <p class="small muted" id="intro"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="현황판 구역">
    <button class="tab" role="tab" id="t-today" data-tab="today" aria-selected="true">오늘<span class="n" id="n-today"></span></button>
    <button class="tab" role="tab" id="t-work" data-tab="work" aria-selected="false">일 목록<span class="n" id="n-work"></span></button>
    <button class="tab" role="tab" id="t-ai" data-tab="ai" aria-selected="false">AI 역할</button>
    <button class="tab" role="tab" id="t-links" data-tab="links" aria-selected="false">연결</button>
  </nav>

  <main>
    <div class="panel" id="p-today" role="tabpanel" aria-labelledby="t-today"></div>
    <div class="panel" id="p-work" role="tabpanel" aria-labelledby="t-work" hidden></div>
    <div class="panel" id="p-ai" role="tabpanel" aria-labelledby="t-ai" hidden></div>
    <div class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden></div>
  </main>
</div>

<script>
(function(){
  var TABS=["today","work","ai","links"], D=null, filter="all";
  var LABEL={done:"완료",doing:"하는 중",todo:"할 일",wait:"민기 님 차례",need:"재료 필요",check:"확인 필요",stop:"멈춤"};
  var CONN={ok:"연결됨",part:"일부만",no:"아직 안 됨"};
  var FILTERS=[["all","전체"],["wait","민기 님 차례"],["need","재료 필요"],["check","확인 필요"],["open","하는 중·할 일"],["done","완료"],["stop","멈춤"]];

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined&&text!==null) e.textContent=text; return e; }
  function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]) p.appendChild(arguments[i]); } return p; }
  function link(text, url){ var a=el("a",null,text); a.href=url; a.target="_blank"; a.rel="noopener"; return a; }
  function md(s){ var d=new Date(s+"T00:00:00"); if(isNaN(d)) return s; return (d.getMonth()+1)+"/"+d.getDate()+" ("+"일월화수목금토".charAt(d.getDay())+")"; }
  function match(s){ if(filter==="all") return true; if(filter==="open") return s==="doing"||s==="todo"; return s===filter; }
  function allItems(){ var a=[]; (D.areas||[]).forEach(function(g){ (g.items||[]).forEach(function(x){ a.push(x); }); }); return a; }
  function count(key){ return allItems().filter(function(x){ var f=filter; filter=key; var m=match(x.s); filter=f; return m; }).length; }

  function renderToday(){
    var P=document.getElementById("p-today"); P.textContent="";
    if(D.ask&&D.ask.length){
      var w=el("section","wait"); add(w, el("h2",null,"민기 님이 정해 주실 것"));
      var ol=el("ol");
      D.ask.forEach(function(x){ var li=el("li"); add(li, el("div","t",x.t)); if(x.why) add(li, el("div",null,x.why)); if(x.how) add(li, el("div","how",x.how)); ol.appendChild(li); });
      add(w, ol); P.appendChild(w);
    }
    var cols=el("div","cols");
    var s1=el("section","sec"); add(s1, el("h2",null,"날짜가 잡힌 일정"));
    var ul=el("ul","rows");
    (D.dates||[]).forEach(function(x){ var li=el("li"); add(li, el("span","k",md(x.d)), el("span",null,x.t)); ul.appendChild(li); });
    add(s1, ul); cols.appendChild(s1);
    var s2=el("section","sec"); add(s2, el("h2",null,"정해진 날에 돌아가는 일"));
    var ur=el("ul","rows r");
    (D.routines||[]).forEach(function(x){ var li=el("li"); var b=el("div"); add(b, el("b",null,x.t)); add(li, b, el("div","s",x.when+" · "+x.who)); ur.appendChild(li); });
    add(s2, ur); cols.appendChild(s2);
    P.appendChild(cols);
  }

  function renderWork(){
    var P=document.getElementById("p-work"); P.textContent="";
    var f=el("div","filters");
    FILTERS.forEach(function(p){ var n=count(p[0]); if(p[0]!=="all"&&n===0) return;
      var b=el("button","chipbtn",p[1]); b.type="button"; b.setAttribute("aria-pressed", String(filter===p[0])); add(b, el("span","n",String(n)));
      b.addEventListener("click", function(){ filter=p[0]; renderWork(); }); f.appendChild(b); });
    P.appendChild(f);
    (D.areas||[]).forEach(function(g){
      var items=(g.items||[]).filter(function(x){ return match(x.s); });
      if(filter!=="all"&&items.length===0) return;
      var s=el("section","sec"); add(s, el("h2",null,g.name));
      if(g.note&&filter==="all") add(s, el("p","note",g.note));
      var ul=el("ul","list");
      items.forEach(function(x){ var li=el("li","item "+x.s), top=el("div","top");
        add(top, el("span","chip "+x.s, LABEL[x.s]||x.s), el("span","t",x.t)); add(li, top);
        if(x.d) add(li, el("div","d",x.d));
        if(x.url){ var wdiv=el("div","small"); add(wdiv, link(x.url_label||"열기", x.url)); add(li, wdiv); }
        ul.appendChild(li); });
      add(s, ul); P.appendChild(s);
    });
  }

  function listOf(arr){ var ul=el("ul","plain"); (arr||[]).forEach(function(t){ ul.appendChild(el("li",null,t)); }); return ul; }
  function renderAI(){
    var P=document.getElementById("p-ai"), A=D.ai||{}; P.textContent="";
    var s0=el("section","sec"); add(s0, el("h2",null,"누가 헤드를 잡나"), el("p","lead",A.head_ko||"")); P.appendChild(s0);
    var s1=el("section","sec"); add(s1, el("h2",null,"그렇게 보는 이유"), listOf(A.why)); P.appendChild(s1);
    var s2=el("section","sec"); add(s2, el("h2",null,"반대로 볼 수 있는 점"), listOf(A.counter)); P.appendChild(s2);
    var s3=el("section","sec"); add(s3, el("h2",null,"맡는 일"));
    var g=el("div","roles");
    (A.roles||[]).forEach(function(r){ var c=el("div","role"), w=el("div","who"); add(w, el("b",null,r.who), el("span",null,r.role)); add(c, w);
      var ul=el("ul"); (r.does||[]).forEach(function(t){ ul.appendChild(el("li",null,t)); }); add(c, ul); g.appendChild(c); });
    add(s3, g); P.appendChild(s3);
    var s4=el("section","sec"); add(s4, el("h2",null,"일을 주고받는 법"), listOf(A.flow)); P.appendChild(s4);
    if(D.files&&D.files.length){
      var s5=el("section","sec"); add(s5, el("h2",null,"구글 드라이브 'AI 공통 기준' 폴더"), el("p","note","Claude와 GPT가 같이 보는 문서입니다. 프로젝트에 넣을 정리본도 여기 있습니다."));
      var ul=el("ul","files"); D.files.forEach(function(x){ var li=el("li"); add(li, link(x.t, x.url)); ul.appendChild(li); });
      add(s5, ul); P.appendChild(s5);
    }
  }

  function renderLinks(){
    var P=document.getElementById("p-links"); P.textContent="";
    var s=el("section","sec"); add(s, el("h2",null,"제가 직접 들어갈 수 있는 곳"), el("p","note","연결된 곳은 민기 님을 거치지 않고 제가 직접 읽고 처리합니다. 안 된 곳은 무엇이 있어야 되는지 적었습니다."));
    var ul=el("ul","conn");
    (D.links||[]).forEach(function(x){ var li=el("li"), top=el("div","top");
      add(top, el("span","chip "+x.state, CONN[x.state]||x.state), el("span","t",x.name)); add(li, top);
      if(x.can){ var d1=el("div","d"); add(d1, el("b",null,"지금 되는 것  "), document.createTextNode(x.can)); add(li, d1); }
      if(x.need){ var d2=el("div","d"); add(d2, el("b",null,"필요한 것  "), document.createTextNode(x.need)); add(li, d2); }
      ul.appendChild(li); });
    add(s, ul); P.appendChild(s);
  }

  function show(tab, quiet){
    if(TABS.indexOf(tab)<0) tab="today";
    TABS.forEach(function(t){ document.getElementById("p-"+t).hidden=(t!==tab); document.getElementById("t-"+t).setAttribute("aria-selected", String(t===tab)); });
    if(!quiet){ try{ localStorage.setItem("board-tab", tab); }catch(e){} }
  }
  function render(data){
    D=data;
    document.getElementById("asof").textContent=D.as_of_ko||""; document.getElementById("intro").textContent=D.intro_ko||"";
    document.getElementById("n-today").textContent=(D.ask&&D.ask.length)?String(D.ask.length):"";
    var open=allItems().filter(function(x){ return x.s!=="done"&&x.s!=="stop"; }).length;
    document.getElementById("n-work").textContent=open?String(open):"";
    renderToday(); renderWork(); renderAI(); renderLinks();
    var start=(location.hash||"").replace("#",""), saved=null;
    try{ saved=localStorage.getItem("board-tab"); }catch(e){}
    show(TABS.indexOf(start)>=0?start:(saved||"today"), true);
  }
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ show(b.getAttribute("data-tab")); }); });

  fetch("data.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(render)
    .catch(function(){ var w=document.querySelector("main"); w.textContent=""; add(w, el("div","err","자료를 불러오지 못했습니다. 페이지를 새로 고쳐 보세요. 계속 안 되면 Claude에게 '업무 현황판이 안 열린다'고 알려 주세요.")); document.getElementById("asof").textContent=""; });
})();
</script>

</body></html>
