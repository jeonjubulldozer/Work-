<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#1E5248"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../icon-192.png"></head><body>
<script src="../vault.js" data-home="../"></script>
<title>업무 현황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: decisions waiting on the owner first, then two columns (taken over / stalled), then routines and dated events */
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#141A21; --muted:#5A6572; --line:#D9DFE6; --soft:#EAEEF2;
  --accent:#1E5248; --accent-ink:#FFFFFF; --warn:#9A5B06; --warn-bg:#FBF1DD; --warn-line:#E9CF95;
  --ok:#1E6B45; --ok-bg:#E3F2E9; --info:#1F55C2; --info-bg:#E6EEFB;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1318; --panel:#171D24; --ink:#E7ECF1; --muted:#98A5B3; --line:#2A333D; --soft:#1F2730;
  --accent:#7CC9B8; --accent-ink:#0F1318; --warn:#E3AA52; --warn-bg:#2A2212; --warn-line:#5C4A22;
  --ok:#7FD0A2; --ok-bg:#16301F; --info:#84ADFF; --info-bg:#1A2740; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1318; --panel:#171D24; --ink:#E7ECF1; --muted:#98A5B3; --line:#2A333D; --soft:#1F2730;
  --accent:#7CC9B8; --accent-ink:#0F1318; --warn:#E3AA52; --warn-bg:#2A2212; --warn-line:#5C4A22;
  --ok:#7FD0A2; --ok-bg:#16301F; --info:#84ADFF; --info-bg:#1A2740; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:26px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:18px;font-weight:600;margin:0}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{max-width:70ch}
.wait{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.wait h2{color:var(--warn)}
.wait ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:n}
.wait li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 52px;position:relative;counter-increment:n;display:flex;flex-direction:column;gap:2px}
.wait li::before{content:counter(n);position:absolute;left:16px;top:12px;font-family:var(--mono);font-weight:500;color:var(--warn);width:24px;text-align:right}
.wait .t{font-weight:600}
.wait .how{color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col>p{font-size:13.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.item .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.item .t{font-weight:600}
.item.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted);font-weight:500}
.item .d{font-size:14px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.doing{background:var(--info-bg);color:var(--info)}
.chip.need,.chip.check{background:var(--warn-bg);color:var(--warn)}
.rows{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.rows li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 16px;border-top:1px solid var(--soft);align-items:baseline}
.rows li:first-child{border-top:0}
.rows .k{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rows.r li{grid-template-columns:1fr}
.rows .s{font-size:13.5px;color:var(--muted)}
.err{padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
@media (max-width:560px){ .wrap{padding-inline:16px} h1{font-size:23px} .wait li{padding-left:44px} .wait li::before{left:10px} }
</style>

<div class="wrap">
  <header class="head">
    <h1>업무 현황판</h1>
    <div class="muted" id="asof">불러오는 중입니다.</div>
    <p class="small muted" id="intro"></p>
  </header>

  <section class="wait" id="wait" hidden>
    <h2>민기 님 답을 기다리는 것</h2>
    <ol id="decisions"></ol>
  </section>

  <div class="cols">
    <section class="col">
      <h2>Claude가 이어받은 것</h2>
      <p>끝난 일은 줄을 그었습니다.</p>
      <ul class="list" id="mine"></ul>
    </section>
    <section class="col">
      <h2>인스팅트가 하다가 멈춘 것</h2>
      <p>'확인 필요'는 인스팅트가 끝냈다고 말했지만 제가 결과를 직접 보지 못한 일입니다.</p>
      <ul class="list" id="stalled"></ul>
    </section>
  </div>

  <div class="cols">
    <section class="col">
      <h2>매일 돌아가는 일</h2>
      <ul class="rows r" id="routines"></ul>
    </section>
    <section class="col">
      <h2>날짜가 잡힌 일정</h2>
      <ul class="rows" id="dates"></ul>
    </section>
  </div>
</div>

<script>
(function(){
  var LABEL={done:"완료",doing:"진행 중",todo:"할 일",need:"자료 필요",check:"확인 필요",stop:"멈춤"};
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined&&text!==null) e.textContent=text; return e; }
  function md(s){ var d=new Date(s+"T00:00:00"); if(isNaN(d)) return s; return (d.getMonth()+1)+"/"+d.getDate()+" ("+"일월화수목금토".charAt(d.getDay())+")"; }
  function items(id, arr){ var ul=document.getElementById(id); ul.textContent="";
    arr.forEach(function(x){ var li=el("li","item "+x.s), top=el("div","top"); top.appendChild(el("span","chip "+x.s, LABEL[x.s]||x.s)); top.appendChild(el("span","t",x.t)); li.appendChild(top);
      if(x.d) li.appendChild(el("div","d",x.d));
      if(x.url){ var a=el("a",null,x.url_label||"열기"); a.href=x.url; a.target="_blank"; a.rel="noopener"; var w=el("div","small"); w.appendChild(a); li.appendChild(w); }
      ul.appendChild(li); }); }
  function render(D){
    document.getElementById("asof").textContent=D.as_of_ko; document.getElementById("intro").textContent=D.intro_ko||"";
    var ol=document.getElementById("decisions"); ol.textContent="";
    (D.decisions||[]).forEach(function(x){ var li=el("li"); li.appendChild(el("div","t",x.t)); if(x.why) li.appendChild(el("div",null,x.why)); if(x.how) li.appendChild(el("div","how",x.how)); ol.appendChild(li); });
    document.getElementById("wait").hidden=!(D.decisions&&D.decisions.length);
    items("mine", D.mine||[]); items("stalled", D.stalled||[]);
    var r=document.getElementById("routines"); r.textContent="";
    (D.routines||[]).forEach(function(x){ var li=el("li"); var b=el("div"); b.appendChild(el("b",null,x.t)); li.appendChild(b); li.appendChild(el("div","s",x.when+" · "+x.who)); r.appendChild(li); });
    var dl=document.getElementById("dates"); dl.textContent="";
    (D.dates||[]).forEach(function(x){ var li=el("li"); li.appendChild(el("span","k",md(x.d))); li.appendChild(el("span",null,x.t)); dl.appendChild(li); });
  }
  fetch("data.json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(render)
    .catch(function(){ var w=document.querySelector(".wrap"); var b=el("div","err","자료를 불러오지 못했습니다. 페이지를 새로 고쳐 보세요. 계속 안 되면 Claude에게 '업무 현황판이 안 열린다'고 알려 주세요."); w.appendChild(b); document.getElementById("asof").textContent=""; });
})();
</script>

</body></html>
